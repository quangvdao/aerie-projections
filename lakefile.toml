name = "CertifiedProjections"
lintDriver = "batteries/runLinter"
defaultTargets = ["CertifiedProjections.Tests.AerieAxioms", "CertifiedProjections.Tests.AerieSpecConstants"]
# Batch builds elaborate each file sequentially: Lake already runs one Lean
# process per core, and asynchronous elaboration of a file with hundreds of small
# declarations spends most of its time in the task scheduler.
moreLeanArgs = ["-DElab.async=false"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 1500
weak.linter.style.header = false

[moreServerOptions]
linter.mathlibStandardSet = true
linter.style.longFile = 1500
linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "CertifiedProjections"
